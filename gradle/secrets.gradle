import java.util.Properties

def secretFiles = [
        rootProject.file("local.properties"),
        rootProject.file("secrets.properties")
]

def secretProperties = new Properties()
secretFiles.findAll { it.exists() }.each { file ->
    file.withInputStream { secretProperties.load(it) }
}

ext.secretValue = { String name ->
    def gradleValue = providers.gradleProperty(name)
    if (gradleValue.present) {
        return gradleValue.get()
    }

    def environmentValue = providers.environmentVariable(name)
    if (environmentValue.present) {
        return environmentValue.get()
    }

    return secretProperties.getProperty(name, "")
}

ext.secretBuildConfigString = { String name ->
    def value = secretValue(name)
    return "\"${value.replace("\\", "\\\\").replace("\"", "\\\"")}\""
}
